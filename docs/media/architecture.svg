<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 576" width="960" height="576"
         role="img" aria-labelledby="arch-title arch-desc"
         font-family="'Geist', 'Helvetica Neue', Arial, sans-serif" id="architecture-root">
      <title id="arch-title">RINGOUT architecture: a SpacetimeDB module and a browser client sharing one simulation file</title>
      <desc id="arch-desc">The module holds reducers, tables and a 30 Hz tick; body rows travel over a WebSocket to the client, which interpolates remote bodies, renders, and predicts its own body; both the tick and the prediction call module/src/sim/step.ts.</desc>

      <defs>
      <style>#architecture-root { --paper: #0d0f12;
    --ink: #e8eaed;
    --muted: #9aa3ad;
    --soft: #7d8894;
    --accent: #e0a45a;
    --link: #7fb2e5; }
      #architecture-root { color: var(--ink); font-family: 'Geist', 'Helvetica Neue', Arial, sans-serif; }
      #architecture-root .lede { font-size: 15px; line-height: 1.55; color: var(--muted); max-width: 66ch; margin: 0 0 32px; }
      #architecture-root .diagram-container { overflow-x: auto; }</style>
        <marker id="architecture-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#9aa3ad"/>
        </marker>
        <marker id="architecture-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#7fb2e5"/>
        </marker>
      </defs>

      <rect width="960" height="576" fill="#0d0f12"/>

      <!-- zones (painted first) -->
      <rect x="24" y="88" width="336" height="264" rx="8" fill="#e8eaed" stroke="#e8eaed" stroke-width="0.8" fill-opacity="0.028" stroke-opacity="0.14"/>
      <text x="40" y="110" fill="#7d8894" font-size="9" letter-spacing="0.14em"
            font-family="'Geist Mono', 'SFMono-Regular', Menlo, monospace">SPACETIMEDB MODULE</text>

      <rect x="600" y="88" width="336" height="264" rx="8" fill="#e8eaed" stroke="#e8eaed" stroke-width="0.8" fill-opacity="0.028" stroke-opacity="0.14"/>
      <text x="616" y="110" fill="#7d8894" font-size="9" letter-spacing="0.14em"
            font-family="'Geist Mono', 'SFMono-Regular', Menlo, monospace">BROWSER CLIENT</text>

      <!-- connectors (painted before nodes) -->
      <!-- reducers write tables -->
      <path d="M 316,192 V 208" fill="none" stroke="#9aa3ad" stroke-width="1.2" marker-end="url(#architecture-arrow)"/>
      <!-- tick writes tables -->
      <path d="M 120,280 V 264" fill="none" stroke="#9aa3ad" stroke-width="1.2" marker-end="url(#architecture-arrow)"/>
      <!-- body rows reach the interpolator -->
      <path d="M 336,232 H 576 Q 584,232 584,224 V 168 Q 584,160 592,160 H 624"
            fill="none" stroke="#7fb2e5" stroke-width="1.2" marker-end="url(#architecture-arrow-link)"/>
      <!-- the same rows reach own-body prediction -->
      <path d="M 336,248 H 584 Q 592,248 592,256 V 296 Q 592,304 600,304 H 624"
            fill="none" stroke="#7fb2e5" stroke-width="1.2" marker-end="url(#architecture-arrow-link)"/>
      <!-- inputs travel up to the reducers, outside both zones -->
      <path d="M 912,312 H 936 Q 944,312 944,304 V 80 Q 944,72 936,72 H 292 Q 284,72 284,80 V 136"
            fill="none" stroke="#9aa3ad" stroke-width="1.2" marker-end="url(#architecture-arrow)"/>
      <!-- prediction and interpolation feed the renderer -->
      <path d="M 760,280 V 264" fill="none" stroke="#9aa3ad" stroke-width="1.2" marker-end="url(#architecture-arrow)"/>
      <path d="M 760,192 V 208" fill="none" stroke="#9aa3ad" stroke-width="1.2" marker-end="url(#architecture-arrow)"/>
      <!-- both runners call the shared integrator -->
      <path d="M 144,336 V 392 Q 144,400 152,400 H 412 Q 420,400 420,408 V 424"
            fill="none" stroke="#9aa3ad" stroke-width="1.2" marker-end="url(#architecture-arrow)"/>
      <path d="M 760,336 V 384 Q 760,392 752,392 H 548 Q 540,392 540,400 V 424"
            fill="none" stroke="#9aa3ad" stroke-width="1.2" marker-end="url(#architecture-arrow)"/>

      <!-- arrow labels -->
      <rect x="418" y="210" width="96" height="13" rx="2" fill="#0d0f12"/>
      <text x="466" y="220" fill="#7d8894" font-size="9" text-anchor="middle" letter-spacing="0.06em"
            font-family="'Geist Mono', 'SFMono-Regular', Menlo, monospace">ROW DELTAS · WSS</text>

      <rect x="430" y="48" width="92" height="13" rx="2" fill="#0d0f12"/>
      <text x="476" y="58" fill="#7d8894" font-size="9" text-anchor="middle" letter-spacing="0.06em"
            font-family="'Geist Mono', 'SFMono-Regular', Menlo, monospace">INPUTS · SEQ</text>

      <!-- left column -->
      <rect x="48" y="136" width="288" height="56" rx="6" fill="#0d0f12"/>
      <rect x="48" y="136" width="288" height="56" rx="6" fill="#171b21" stroke="#e8eaed" stroke-width="1" stroke-opacity="0.45"/>
      <rect x="58" y="144" width="52" height="13" rx="2" fill="none" stroke="#e8eaed" stroke-width="0.8" stroke-opacity="0.28"/>
      <text x="84" y="154" fill="#e8eaed" font-size="8" text-anchor="middle" letter-spacing="0.08em"
            font-family="'Geist Mono', 'SFMono-Regular', Menlo, monospace" fill-opacity="0.72">REDUCER</text>
      <text x="192" y="176" fill="#e8eaed" font-size="14" font-weight="600" text-anchor="middle">Reducers</text>
      <text x="192" y="190" fill="#9aa3ad" font-size="10" text-anchor="middle"
            font-family="'Geist Mono', 'SFMono-Regular', Menlo, monospace">join · ready · start · submit_inputs</text>

      <rect x="48" y="208" width="288" height="56" rx="6" fill="#0d0f12"/>
      <rect x="48" y="208" width="288" height="56" rx="6" fill="#171b21" stroke="#e8eaed" stroke-width="1" stroke-opacity="0.45"/>
      <rect x="58" y="216" width="42" height="13" rx="2" fill="none" stroke="#e8eaed" stroke-width="0.8" stroke-opacity="0.28"/>
      <text x="79" y="226" fill="#e8eaed" font-size="8" text-anchor="middle" letter-spacing="0.08em"
            font-family="'Geist Mono', 'SFMono-Regular', Menlo, monospace" fill-opacity="0.72">TABLE</text>
      <text x="192" y="248" fill="#e8eaed" font-size="14" font-weight="600" text-anchor="middle">Tables</text>
      <text x="192" y="262" fill="#9aa3ad" font-size="10" text-anchor="middle"
            font-family="'Geist Mono', 'SFMono-Regular', Menlo, monospace">body · player · match · input_frame</text>

      <rect x="48" y="280" width="288" height="56" rx="6" fill="#0d0f12"/>
      <rect x="48" y="280" width="288" height="56" rx="6" fill="#171b21" stroke="#e8eaed" stroke-width="1" stroke-opacity="0.45"/>
      <rect x="58" y="288" width="62" height="13" rx="2" fill="none" stroke="#e8eaed" stroke-width="0.8" stroke-opacity="0.28"/>
      <text x="89" y="298" fill="#e8eaed" font-size="8" text-anchor="middle" letter-spacing="0.08em"
            font-family="'Geist Mono', 'SFMono-Regular', Menlo, monospace" fill-opacity="0.72">SCHEDULE</text>
      <text x="192" y="320" fill="#e8eaed" font-size="14" font-weight="600" text-anchor="middle">Tick — 30 Hz</text>
      <text x="192" y="334" fill="#9aa3ad" font-size="10" text-anchor="middle"
            font-family="'Geist Mono', 'SFMono-Regular', Menlo, monospace">33.3 ms · authority</text>

      <!-- right column -->
      <rect x="624" y="136" width="288" height="56" rx="6" fill="#0d0f12"/>
      <rect x="624" y="136" width="288" height="56" rx="6" fill="#171b21" stroke="#e8eaed" stroke-width="1" stroke-opacity="0.45"/>
      <rect x="634" y="144" width="50" height="13" rx="2" fill="none" stroke="#e8eaed" stroke-width="0.8" stroke-opacity="0.28"/>
      <text x="659" y="154" fill="#e8eaed" font-size="8" text-anchor="middle" letter-spacing="0.08em"
            font-family="'Geist Mono', 'SFMono-Regular', Menlo, monospace" fill-opacity="0.72">REMOTE</text>
      <text x="768" y="176" fill="#e8eaed" font-size="14" font-weight="600" text-anchor="middle">Interpolation</text>
      <text x="768" y="190" fill="#9aa3ad" font-size="10" text-anchor="middle"
            font-family="'Geist Mono', 'SFMono-Regular', Menlo, monospace">remotes · drawn at −100 ms</text>

      <rect x="624" y="208" width="288" height="56" rx="6" fill="#0d0f12"/>
      <rect x="624" y="208" width="288" height="56" rx="6" fill="#171b21" stroke="#e8eaed" stroke-width="1" stroke-opacity="0.45"/>
      <rect x="634" y="216" width="40" height="13" rx="2" fill="none" stroke="#e8eaed" stroke-width="0.8" stroke-opacity="0.28"/>
      <text x="654" y="226" fill="#e8eaed" font-size="8" text-anchor="middle" letter-spacing="0.08em"
            font-family="'Geist Mono', 'SFMono-Regular', Menlo, monospace" fill-opacity="0.72">VIEW</text>
      <text x="768" y="248" fill="#e8eaed" font-size="14" font-weight="600" text-anchor="middle">Render &amp; HUD</text>
      <text x="768" y="262" fill="#9aa3ad" font-size="10" text-anchor="middle"
            font-family="'Geist Mono', 'SFMono-Regular', Menlo, monospace">three.js · corr · rtt</text>

      <rect x="624" y="280" width="288" height="56" rx="6" fill="#0d0f12"/>
      <rect x="624" y="280" width="288" height="56" rx="6" fill="#171b21" stroke="#e8eaed" stroke-width="1" stroke-opacity="0.45"/>
      <rect x="634" y="288" width="60" height="13" rx="2" fill="none" stroke="#e8eaed" stroke-width="0.8" stroke-opacity="0.28"/>
      <text x="664" y="298" fill="#e8eaed" font-size="8" text-anchor="middle" letter-spacing="0.08em"
            font-family="'Geist Mono', 'SFMono-Regular', Menlo, monospace" fill-opacity="0.72">OWN BODY</text>
      <text x="768" y="320" fill="#e8eaed" font-size="14" font-weight="600" text-anchor="middle">Prediction</text>
      <text x="768" y="334" fill="#9aa3ad" font-size="10" text-anchor="middle"
            font-family="'Geist Mono', 'SFMono-Regular', Menlo, monospace">replay · reconcile</text>

      <!-- the shared integrator (the one accent) -->
      <rect x="300" y="424" width="360" height="64" rx="6" fill="#0d0f12"/>
      <rect x="300" y="424" width="360" height="64" rx="6" fill="#e0a45a" stroke="#e0a45a" stroke-width="1.2" fill-opacity="0.10"/>
      <rect x="312" y="434" width="54" height="13" rx="2" fill="none" stroke="#e0a45a" stroke-width="0.8" stroke-opacity="0.55"/>
      <text x="339" y="444" fill="#e0a45a" font-size="8" text-anchor="middle" letter-spacing="0.08em"
            font-family="'Geist Mono', 'SFMono-Regular', Menlo, monospace">SHARED</text>
      <text x="480" y="466" fill="#e8eaed" font-size="14" font-weight="600" text-anchor="middle">module/src/sim/step.ts</text>
      <text x="480" y="480" fill="#c9a173" font-size="10" text-anchor="middle"
            font-family="'Geist Mono', 'SFMono-Regular', Menlo, monospace">stepBody · imported by both runners</text>

      <!-- legend strip -->
      <line x1="24" y1="520" x2="936" y2="520" stroke="#e8eaed" stroke-width="0.8" stroke-opacity="0.12"/>
      <text x="24" y="542" fill="#9aa3ad" font-size="9" letter-spacing="0.14em"
            font-family="'Geist Mono', 'SFMono-Regular', Menlo, monospace">LEGEND</text>

      <line x1="104" y1="539" x2="136" y2="539" stroke="#7fb2e5" stroke-width="1.2"/>
      <text x="144" y="542" fill="#9aa3ad" font-size="9" letter-spacing="0.06em"
            font-family="'Geist Mono', 'SFMono-Regular', Menlo, monospace">STATE OVER WEBSOCKET</text>

      <line x1="304" y1="539" x2="336" y2="539" stroke="#9aa3ad" stroke-width="1.2"/>
      <text x="344" y="542" fill="#9aa3ad" font-size="9" letter-spacing="0.06em"
            font-family="'Geist Mono', 'SFMono-Regular', Menlo, monospace">CALL / WRITE</text>

      <rect x="472" y="531" width="16" height="13" rx="2" fill="#e0a45a" stroke="#e0a45a" stroke-width="1" fill-opacity="0.10"/>
      <text x="496" y="542" fill="#9aa3ad" font-size="9" letter-spacing="0.06em"
            font-family="'Geist Mono', 'SFMono-Regular', Menlo, monospace">THE ONE INTEGRATOR</text>
    </svg>
